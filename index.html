<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Management</title>
  <style>
    body { font-family: 'Segoe UI', Arial; background: #f7f7fb; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h2 { text-align: center; color: #333; }
    form { display: flex; gap: 8px; margin-bottom: 24px; justify-content: center; }
    input[type=text], input[type=email] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; background: #4f8cff; color: #fff; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #357ae8; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: left; }
    th { background: #f0f4fa; }
    td.actions { width: 150px; text-align: center; } /* Fixed width for actions column */
    .actions button { margin-right: 4px; padding: 6px 10px; font-size: 12px; } /* Adjust button size */
    .actions button:last-child { margin-right: 0; } /* Remove margin for the last button */
    tr:nth-child(even) { background: #f9f9fc; }
    .actions button { margin-right: 4px; }
    .edit-row input { width: 90%; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Hotel Guests Management</h2>
    <form id="addForm">
      <input type="text" id="name" placeholder="Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <button type="submit">Check In</button>
    </form>
    <table id="userTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Room Number</th>
          <th>Created At</th>
          <th>Updated At</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script>
    let editingId = null;
    let editingName = '';
    let editingEmail = '';

    function fetchUsers() {
      fetch('http://localhost:3000/users')
        .then(res => res.json())
        .then(data => {
          const tbody = document.querySelector('#userTable tbody');
          tbody.innerHTML = '';
          data.forEach(u => {
            if (editingId === u.id) {
              tbody.innerHTML += `<tr class='edit-row'>
                <td>${u.id}</td>
                <td><input type='text' id='editName' value='${editingName}'></td>
                <td><input type='email' id='editEmail' value='${editingEmail}'></td>
                <td>${u.room_number || ''}</td>
                <td>${u.created_at}</td>
                <td>${u.updated_at}</td>
                <td class='actions'>
                  <button onclick='saveEdit(${u.id})'>Save</button>
                  <button onclick='cancelEdit()'>Cancel</button>
                </td>
              </tr>`;
            } else {
              tbody.innerHTML += `<tr>
                <td>${u.id}</td>
                <td>${u.name}</td>
                <td>${u.email}</td>
                <td>${u.room_number || ''}</td>
                <td>${u.created_at}</td>
                <td>${u.updated_at}</td>
                <td class='actions'>
                  <button onclick='startEdit(${u.id}, "${u.name}", "${u.email}")'>Edit</button>
                  <button onclick='deleteUser(${u.id})'>Check Out</button>
                </td>
              </tr>`;
            }
          });
        });
    }
    fetchUsers();

    document.getElementById('addForm').onsubmit = function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      fetch('http://localhost:3000/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
      }).then(() => {
        fetchUsers();
        this.reset();
      });
    };

    window.deleteUser = function(id) {
      fetch(`http://localhost:3000/users/${id}`, { method: 'DELETE' })
        .then(() => fetchUsers());
    };

    window.startEdit = function(id, name, email) {
      editingId = id;
      editingName = name;
      editingEmail = email;
      fetchUsers();
    };

    window.saveEdit = function(id) {
      const name = document.getElementById('editName').value;
      const email = document.getElementById('editEmail').value;
      fetch(`http://localhost:3000/users/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
      }).then(() => {
        editingId = null;
        fetchUsers();
      });
    };

    window.cancelEdit = function() {
      editingId = null;
      fetchUsers();
    };
  </script>
</body>
</html>
