<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Management</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      position: relative;
      overflow-x: hidden;
    }
    .background-visual {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 20% 30%, #a8edea 0%, #fed6e3 100%);
      opacity: 0.7;
    }
    .container {
      max-width: 650px;
      margin: 48px auto;
      background: rgba(255,255,255,0.25);
      border-radius: 18px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
      padding: 40px 32px;
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.18);
      position: relative;
      z-index: 1;
    }
    h2 {
      text-align: center;
      color: #333;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 24px;
      text-shadow: 0 2px 8px #fff6;
    }
    form {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      justify-content: center;
    }
    input[type=text], input[type=email] {
      padding: 10px 12px;
      border: 1px solid #d1d1d1;
      border-radius: 6px;
      font-size: 1rem;
      background: rgba(255,255,255,0.7);
      box-shadow: 0 1px 4px #0001;
      transition: border 0.2s;
    }
    input[type=text]:focus, input[type=email]:focus {
      border: 1.5px solid #4f8cff;
      outline: none;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(90deg, #4f8cff 0%, #a8edea 100%);
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      box-shadow: 0 2px 8px #4f8cff33;
      transition: background 0.2s, box-shadow 0.2s;
    }
    button:hover {
      background: linear-gradient(90deg, #357ae8 0%, #fed6e3 100%);
      box-shadow: 0 4px 16px #357ae833;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 8px;
      background: rgba(255,255,255,0.6);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px #0001;
    }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 12px 10px;
      text-align: left;
      font-size: 1rem;
    }
    th {
      background: rgba(240,244,250,0.8);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    td.actions {
      width: 150px;
      text-align: center;
    }
    .actions button {
      margin-right: 4px;
      padding: 7px 14px;
      font-size: 13px;
      border-radius: 5px;
      background: linear-gradient(90deg, #4f8cff 0%, #a8edea 100%);
      box-shadow: 0 1px 4px #4f8cff22;
    }
    .actions button:last-child {
      margin-right: 0;
    }
    tr:nth-child(even) {
      background: rgba(249,249,252,0.7);
    }
    .edit-row input {
      width: 90%;
      background: rgba(255,255,255,0.9);
      border: 1px solid #b0c4de;
      border-radius: 5px;
      padding: 8px;
    }
    @media (max-width: 700px) {
      .container {
        max-width: 98vw;
        padding: 16px 4vw;
      }
      table th, table td {
        font-size: 0.95rem;
        padding: 8px 6px;
      }
    }
  </style>
</head>
<body>
  <div class="background-visual"></div>
  <div class="container">
    <h2>User Management Demo</h2>
    <form id="addForm">
      <input type="text" id="name" placeholder="Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <button type="submit">Add User</button>
    </form>
    <table id="userTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Room Number</th>
          <th>Created At</th>
          <th>Updated At</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script>
    let editingId = null;
    let editingName = '';
    let editingEmail = '';

    function fetchUsers() {
      fetch('http://localhost:3000/users')
        .then(res => res.json())
        .then(data => {
          const tbody = document.querySelector('#userTable tbody');
          tbody.innerHTML = '';
          data.forEach(u => {
            if (editingId === u.id) {
              tbody.innerHTML += `<tr class='edit-row'>
                <td>${u.id}</td>
                <td><input type='text' id='editName' value='${editingName}'></td>
                <td><input type='email' id='editEmail' value='${editingEmail}'></td>
                <td>${u.room_number || ''}</td>
                <td>${u.created_at}</td>
                <td>${u.updated_at}</td>
                <td class='actions'>
                  <button onclick='saveEdit(${u.id})'>Save</button>
                  <button onclick='cancelEdit()'>Cancel</button>
                </td>
              </tr>`;
            } else {
              tbody.innerHTML += `<tr>
                <td>${u.id}</td>
                <td>${u.name}</td>
                <td>${u.email}</td>
                <td>${u.room_number || ''}</td>
                <td>${u.created_at}</td>
                <td>${u.updated_at}</td>
                <td class='actions'>
                  <button onclick='startEdit(${u.id}, "${u.name}", "${u.email}")'>Edit</button>
                  <button onclick='deleteUser(${u.id})'>Delete</button>
                </td>
              </tr>`;
            }
          });
        });
    }
    fetchUsers();

    document.getElementById('addForm').onsubmit = function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      fetch('http://localhost:3000/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
      }).then(() => {
        fetchUsers();
        this.reset();
      });
    };

    window.deleteUser = function(id) {
      fetch(`http://localhost:3000/users/${id}`, { method: 'DELETE' })
        .then(() => fetchUsers());
    };

    window.startEdit = function(id, name, email) {
      editingId = id;
      editingName = name;
      editingEmail = email;
      fetchUsers();
    };

    window.saveEdit = function(id) {
      const name = document.getElementById('editName').value;
      const email = document.getElementById('editEmail').value;
      fetch(`http://localhost:3000/users/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
      }).then(() => {
        editingId = null;
        fetchUsers();
      });
    };

    window.cancelEdit = function() {
      editingId = null;
      fetchUsers();
    };
  </script>
</body>
</html>
